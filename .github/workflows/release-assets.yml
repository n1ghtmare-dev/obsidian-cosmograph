name: Publish plugin release assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  upload-assets:
    if: contains(github.event.head_commit.message, '[release-assets]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Obsidian plugin
        run: npm run build:plugin

      - name: Verify release version
        id: manifest
        shell: bash
        run: echo "version=$(node -p \"require('./manifest.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.manifest.outputs.version }}
        run: gh release upload "$RELEASE_VERSION" main.js manifest.json --clobber
